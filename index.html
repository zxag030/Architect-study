<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>건축기사 · 암기 루틴</title><style>
:root{--ink:#222725;--sub:#737a75;--line:#e7e8e4;--bg:#f6f7f4;--paper:#fff;--accent:#315f50;--mist:#e9f2ed;--alert:#ae663f;--light:#fff7f1}*{box-sizing:border-box}html,body{margin:0;font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100dvh}.sidebar{padding:35px 20px 20px 27px;background:#fff;border-right:1px solid var(--line);position:sticky;top:0;height:100dvh}.brand{font-weight:750;letter-spacing:-.6px;font-size:21px;margin-bottom:3px}.brand-caption{font-size:11px;letter-spacing:1.3px;color:var(--sub)}.nav{display:grid;gap:5px;margin-top:58px}.nav button{border:0;background:none;border-radius:10px;text-align:left;padding:13px 15px;font-size:14px;color:#676c69;font-weight:600}.nav button.active{color:var(--accent);background:var(--mist)}.aside-bottom{position:absolute;bottom:25px;left:27px;right:25px;color:var(--sub);font-size:12px;line-height:1.7}.main{max-width:1200px;width:100%;margin:0 auto;padding:44px 48px 90px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.heading{font-size:32px;line-height:1.3;letter-spacing:-1.2px;margin:12px 0 8px;font-weight:760}.sub{font-size:14px;color:var(--sub);line-height:1.7;margin:0 0 28px}.surface{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 2px 6px #172a1903}.wide{max-width:890px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.kpi .small{color:var(--sub);font-size:12px}.kpi .num{font-size:27px;letter-spacing:-.8px;font-weight:700;margin-top:11px}.kpi .meta{font-size:12px;color:var(--sub);margin-top:5px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:36px 0 15px}.sectionhead h2{font-size:18px;margin:0;letter-spacing:-.4px}.btn{border-radius:10px;border:1px solid var(--line);padding:11px 16px;background:#fff;font-size:13px;font-weight:650;color:var(--ink)}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn.tonal{background:var(--mist);color:var(--accent);border-color:transparent}.btn.warn{background:var(--light);color:var(--alert)}.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.muted{color:var(--sub)}.tiny{font-size:12px}.strong{font-weight:730}.datecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}.day{border:1px solid var(--line);border-radius:12px;padding:15px;background:white;text-align:left;min-height:128px}.day.active{border-color:var(--accent);box-shadow:0 0 0 2px #315f5016}.day .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub)}.day .title{font-size:14px;font-weight:700;margin-top:13px;line-height:1.55}.day .bottom{font-size:12px;color:var(--sub);margin-top:12px}.day .dot{display:inline-block;width:6px;height:6px;background:var(--accent);border-radius:50%}.bar{background:#e9ebe7;height:7px;border-radius:30px;overflow:hidden}.fill{background:var(--accent);height:100%;transition:width .25s}.studybox{max-width:780px}.stepbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.step{font-size:12px;padding:7px 11px;border-radius:20px;background:#edf0ec;color:#7b837d;font-weight:650}.step.active{background:var(--accent);color:white}.step.done{background:var(--mist);color:var(--accent)}.qnum{color:var(--sub);font-size:12px}.question{font-size:23px;font-weight:750;line-height:1.55;letter-spacing:-.5px;margin:16px 0 24px}.answerBox{border:1px solid var(--line);border-radius:11px;padding:20px;background:#fafbf9;white-space:pre-wrap;line-height:1.95;font-size:15px}.typeInput,.freeInput,textarea,input[type=text],input[type=number],select{border:1px solid #daddd7;border-radius:9px;padding:11px 13px;background:#fff;outline:none;color:var(--ink)}.typeInput:focus,.freeInput:focus,textarea:focus,input:focus,select:focus{border-color:#729b89;box-shadow:0 0 0 3px #e6f0e9}.typeInput,.freeInput{width:100%;margin-top:14px;min-height:160px;resize:vertical;line-height:1.8}.freeInput{min-height:210px}.answerRow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:5px 0}.answerRow.short{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:11px}.answerRow .line{font-size:14px;line-height:2.3}.blankInput{height:34px;min-width:85px;max-width:100%;border:0;border-bottom:2px solid #9baca1;border-radius:0;background:#f4f7f4;font-size:14px;padding:2px 7px;vertical-align:middle}.blankInput.right{border-bottom-color:#46846b;background:#e8f4ec}.blankInput.wrong{border-bottom-color:#d49476;background:#fff3ec}.assess{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}.assess button{padding:14px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left}.assess button:hover{border-color:var(--accent)}.assess .small{font-size:11px;color:var(--sub);margin-top:5px}.chip{font-size:11px;color:var(--accent);background:var(--mist);border-radius:40px;padding:6px 10px;font-weight:700}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.divider{border:0;border-top:1px solid var(--line);margin:22px 0}.hint{font-size:13px;color:var(--sub);line-height:1.8}.feedback{margin-top:14px;background:#edf4ef;color:#375d4e;border-radius:9px;padding:10px 14px;font-size:13px;line-height:1.7}.feedback.warn{background:#fff6ee;color:#97613e}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 18px}.toolbar input{flex:1;min-width:150px}.toolbar select{min-width:130px}.rows{display:grid;gap:9px}.item{padding:15px 18px;border-radius:11px;background:white;border:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between}.item h3{margin:0 0 6px;font-size:14px}.item .meta{color:var(--sub);font-size:12px;line-height:1.5}.item .actions{display:flex;flex-wrap:wrap;gap:6px}.item .actions button{padding:7px 9px;font-size:11px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field label{font-size:12px;font-weight:700;color:#595f5b}.field.full{grid-column:1/-1}.field textarea{min-height:120px;resize:vertical;line-height:1.7}.notice{background:#f3f7f2;border:1px solid #e1eae3;border-radius:11px;padding:14px 16px;font-size:13px;line-height:1.7}.empty{text-align:center;padding:50px 20px;color:var(--sub)}.empty h3{color:var(--ink)}.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}.pill{border:1px solid var(--line);border-radius:30px;background:white;padding:9px 12px;font-size:12px}.pill.active{background:var(--accent);color:white;border-color:var(--accent)}.pdf-viewer{width:100%;height:62vh;border:0;border-radius:10px;background:#fff}.overlay{position:fixed;inset:0;background:#1b2a2399;z-index:10;display:flex;align-items:center;justify-content:center;padding:15px}.modal{width:min(730px,100%);max-height:90vh;overflow:auto;background:white;border-radius:16px;padding:22px}.keyhits{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.keyhits span{border-radius:20px;padding:6px 10px;font-size:12px;background:#f6ece8;color:#a16b4e}.keyhits span.hit{background:var(--mist);color:var(--accent)}@media(max-width:780px){.app{display:block}.sidebar{position:sticky;top:0;height:auto;padding:12px 18px;background:#fff;z-index:5;display:flex;align-items:center;gap:12px;justify-content:space-between}.brand{font-size:15px;margin:0}.brand-caption,.aside-bottom{display:none}.nav{display:flex;margin:0;gap:2px;overflow:auto}.nav button{white-space:nowrap;font-size:12px;padding:9px 8px}.main{padding:26px 18px 80px}.heading{font-size:27px}.surface{padding:18px}.grid3{gap:7px}.kpi .num{font-size:22px}.kpi .meta{display:none}.assess{grid-template-columns:1fr}.assess button{padding:12px}.formgrid{grid-template-columns:1fr}.question{font-size:20px}.item{align-items:flex-start;flex-direction:column}.toolbar>*{width:100%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="root"></div><script>
const STARTER_CARDS=[{"id":"q001","q":"시공계획서 제출 시 환경관리 및 친환경관리에 대해 제출할 서류를 쓰시오.","answer":"건설폐기물 저감 및 재활용계획\n산업부산물 재활용계획\n온실가스 배출 저감 계획\n천연자원 사용 저감 계획\n수자원활용 계획\n작업장, 대지 및 대지 주변의 환경관리계획","blanks":["건설폐기물","산업부산물","온실가스","천연자원","수자원","환경관리계획"],"page":80,"category":"가설공사","kind":"빈출","note":""},{"id":"q002","q":"기준점의 설치목적을 쓰시오.","answer":"공사 중 높이 기준을 정하기 위해 설치하는 원점","blanks":["높이 기준","원점"],"page":80,"category":"가설공사","kind":"빈출","note":""},{"id":"q003","q":"기준점 설치 시 주의사항 3가지를 쓰시오.","answer":"지면 0.5m~1m 위로 공사에 지장 없게 설치\n이동 염려가 없는 곳에 설치\n필요하면 보조기준점 1~2개소 이상 설치","blanks":["0.5m~1m","이동 염려","보조기준점"],"page":80,"category":"가설공사","kind":"빈출","note":""},{"id":"q004","q":"방호선반이란 무엇인가?","answer":"상부에서 작업 도중 자재나 공구 등 낙하피해를 방지하기 위해 벽체나 비계 외부에 설치하는 금속판재","blanks":["낙하피해","금속판재"],"page":80,"category":"가설공사","kind":"빈출","note":""},{"id":"q005","q":"예민비의 정의와 식을 쓰시오.","answer":"식: 자연시료의 강도 / 이긴시료의 강도\n점토에서 자연시료를 함수율 변화 없이 이기면 약해지는 정도를 표시한 것","blanks":["자연시료의 강도","이긴시료의 강도","함수율"],"page":80,"category":"토공사","kind":"빈출","note":""},{"id":"q006","q":"보링의 종류 4가지를 쓰시오.","answer":"오우거 보링\n수세식 보링\n회전식 보링\n충격식 보링","blanks":["오우거","수세식","회전식","충격식"],"page":80,"category":"토공사","kind":"빈출","note":""},{"id":"q007","q":"회전식 보링의 특징을 쓰시오.","answer":"지층 변화를 연속적·비교적 정확히 알고자 할 때 사용\n중경날 회전 천공\n토층 흐트러질 우려 적음","blanks":["지층 변화","회전 천공","흐트러질 우려"],"page":80,"category":"토공사","kind":"빈출","note":""},{"id":"q008","q":"충격식 보링의 특징을 쓰시오.","answer":"경질층에 적합\n충격날을 60~70cm 낙하\n낙하 충격으로 파쇄된 토사를 퍼 지층 상태 판단","blanks":["경질층","60~70cm","낙하 충격"],"page":81,"category":"토공사","kind":"빈출","note":""},{"id":"q009","q":"수세식 보링의 특징을 쓰시오.","answer":"수압을 이용하여 연질층 탐사\n외경 50~60mm 관 이용\n흙과 물을 동시 배출","blanks":["수압","연질층","흙과 물"],"page":81,"category":"토공사","kind":"빈출","note":""},{"id":"q010","q":"안정액 벤토나이트의 기능 3가지를 쓰시오.","answer":"굴착벽면 붕괴방지\n굴착토사 분리배출\n부유물 침전방지","blanks":["붕괴방지","분리배출","침전방지"],"page":81,"category":"토공사","kind":"빈출","note":""},{"id":"q011","q":"SPS 공법의 특징을 쓰시오.","answer":"가설지지체 설치 및 해체공정 불필요\n작업공간 확보\n지반상태에 상관없이 시공 가능\n지상공사와 병행 가능하여 공기단축 가능","blanks":["가설지지체","작업공간","지반상태","공기단축"],"page":81,"category":"토공사","kind":"빈출","note":""},{"id":"q012","q":"톱다운(Top-down) 공법의 특징을 쓰시오.","answer":"1층 슬래브를 먼저 타설하여 작업공간 활용\n지상·지하 동시시공하여 공기단축 용이\n날씨에 무관하게 공사 진행\n주변 지반 영향이 적음","blanks":["1층 슬래브","지상·지하","날씨","주변 지반"],"page":81,"category":"토공사","kind":"빈출","note":""},{"id":"q013","q":"히빙(Heaving) 현상이란?","answer":"흙막이 벽 내외측의 토압 차이 등으로 굴착 저면의 흙이 솟아오르는 현상","blanks":["굴착 저면","솟아오르는"],"page":82,"category":"토공사","kind":"빈출","note":""},{"id":"q014","q":"보일링(Boiling) 현상이란?","answer":"흙막이 뒷면 수위가 높아 지하수가 흙막이 벽 밑을 지나 공사장 안 바닥에서 모래와 함께 솟아오르는 현상","blanks":["지하수","흙막이 벽 밑","모래"],"page":82,"category":"토공사","kind":"빈출","note":""},{"id":"q015","q":"히빙·보일링 방지대책을 쓰시오.","answer":"흙막이 벽 근입장 증가\n배수공법으로 지하수위 저하\n지반 개량으로 전단강도 증가\n굴착 작업은 흙막이 부재 설치에 필요한 최소 깊이만 실시","blanks":["근입장","지하수위","전단강도","최소 깊이"],"page":82,"category":"토공사","kind":"빈출","note":""},{"id":"q016","q":"지정(地定)이란?","answer":"기초판을 지지하기 위해 그 아래에 설치하는 버림콘크리트, 잡석, 말뚝 등","blanks":["기초판","버림콘크리트","잡석","말뚝"],"page":82,"category":"지정·기초","kind":"빈출","note":""},{"id":"q017","q":"지하구조물 부상 방지대책 4가지를 쓰시오.","answer":"차수공법으로 물 차단\n강제 배수\n구조물 자중 증대\n락앵커 공법 사용","blanks":["차수","배수","자중","락앵커"],"page":82,"category":"지정·기초","kind":"빈출","note":""},{"id":"q018","q":"샌드드레인 공법의 원리를 쓰시오.","answer":"점토질 지반에 구멍을 뚫어 모래를 넣고 성토 등의 하중을 가하여 압밀을 촉진하는 공법","blanks":["점토질","모래","성토","압밀"],"page":83,"category":"지정·기초","kind":"빈출","note":""},{"id":"q019","q":"압밀과 다짐의 차이를 쓰시오.","answer":"압밀: 점토질 지반에 외력이 작용하여 간극수가 배출되는 현상\n다짐: 사질 지반에 외력이 작용하여 공기가 빠지며 압축되는 현상","blanks":["점토질","간극수","사질","공기"],"page":83,"category":"지정·기초","kind":"빈출","note":""},{"id":"q020","q":"부동침하 방지대책을 쓰시오.","answer":"마찰말뚝 사용\n지하실 설치\n기초 상호 간 연결\n언더피닝 공법 적용","blanks":["마찰말뚝","지하실","기초","언더피닝"],"page":83,"category":"지정·기초","kind":"빈출","note":""},{"id":"q021","q":"언더피닝 공법의 목적을 쓰시오.","answer":"기존 건축물의 기초를 보강하거나 인접 건물에 침하·균열 등의 피해를 예방하기 위한 기초보강 방법","blanks":["기초보강","침하","균열"],"page":83,"category":"지정·기초","kind":"빈출","note":""},{"id":"q022","q":"철근의 기본 이음 방법 3가지를 쓰시오.","answer":"겹침이음\n용접이음\n기계식 이음(연결재 사용)","blanks":["겹침이음","용접이음","기계식 이음"],"page":83,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q023","q":"철근 간격을 유지하는 목적 3가지를 쓰시오.","answer":"콘크리트 유동성 확보\n소요강도 확보\n재료분리 방지","blanks":["유동성","소요강도","재료분리"],"page":84,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q024","q":"철근 부식에 대한 방청 조치를 쓰시오.","answer":"에폭시 코팅철근 사용\n철근 표면 아연도금 처리\n골재에 제염제 혼입\n콘크리트에 방청제 혼입","blanks":["에폭시","아연도금","제염제","방청제"],"page":84,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q025","q":"갱폼(Gang form)의 장단점을 쓰시오.","answer":"장점: 조립 및 해체작업 생략, 노동력 절감 및 공기 단축\n단점: 제작·해체 후 보관장소 필요, 초기 투자비가 재래식보다 높음","blanks":["조립","노동력","보관장소","초기 투자비"],"page":84,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q026","q":"슬립폼(Slip form)이란?","answer":"거푸집을 연속 이동하며 콘크리트를 타설하는 공법으로 시공이음 없는 균일 시공이 가능하며 수직 연속 구조물에 활용","blanks":["연속 이동","시공이음","수직"],"page":84,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q027","q":"트래블링폼(Traveling form)이란?","answer":"트래블러 장치를 이용해 수평 이동이 가능한 대형 시스템 거푸집으로 터널이나 지하철 공사에 적용","blanks":["수평 이동","터널","지하철"],"page":85,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q028","q":"터널폼(Tunnel form)이란?","answer":"한 구획의 벽판과 바닥판을 ㄱ자형 또는 ㄷ자형으로 짠 거푸집","blanks":["벽판","바닥판","ㄱ자형","ㄷ자형"],"page":85,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q029","q":"와플폼(Waffle form)이란?","answer":"무량판 구조에서 2방향 장선 바닥판 구조가 가능하도록 한 특수한 상자 모양의 기성재 거푸집","blanks":["무량판","2방향 장선","상자"],"page":85,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q030","q":"스페이서와 세퍼레이터의 용도를 구분하시오.","answer":"스페이서: 철근의 피복두께 유지\n세퍼레이터: 거푸집이 오므라드는 것을 방지하여 간격 유지","blanks":["피복두께","오므라드는","간격"],"page":85,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q031","q":"알칼리 골재반응 방지대책을 쓰시오.","answer":"알칼리 함량 0.6% 이하 시멘트 사용\n반응에 무해한 골재 사용\n플라이애시·고로슬래그 등 양질의 혼화재 사용","blanks":["0.6%","무해한 골재","플라이애시","고로슬래그"],"page":85,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q032","q":"물시멘트비의 정의를 쓰시오.","answer":"시멘트 중량에 대한 유효수량의 중량 백분율","blanks":["시멘트 중량","유효수량","백분율"],"page":85,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q033","q":"콜드조인트(Cold joint)란?","answer":"콘크리트 이어치기 시간 경과로 콘크리트가 일체화되지 않아 발생하는 계획되지 않은 이음","blanks":["이어치기","일체화","계획되지 않은"],"page":86,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q034","q":"레미콘 표기 25-24-150의 의미는?","answer":"25: 굵은골재 최대치수 25mm\n24: 호칭강도 24MPa\n150: 소요 슬럼프값 150mm","blanks":["굵은골재","호칭강도","슬럼프"],"page":86,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q035","q":"레미콘 현장 품질 확인사항을 쓰시오.","answer":"슬럼프 시험\n공기량 시험\n공시체 압축강도 시험\n염화물 함유량 측정\n온도 측정","blanks":["슬럼프","공기량","압축강도","염화물","온도"],"page":86,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q036","q":"프리텐셔닝(Pre-tensioning) 공법의 순서를 쓰시오.","answer":"PS 강재 긴장 → 콘크리트 타설 → PS 강재와 콘크리트 접합 → 프리스트레스 도입","blanks":["PS 강재 긴장","콘크리트 타설","접합","프리스트레스"],"page":87,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q037","q":"포스트텐셔닝(Post-tensioning) 공법의 순서를 쓰시오.","answer":"쉬스 설치 → 콘크리트 타설 → PS 강재 삽입·긴장·고정 → 그라우팅 → 프리스트레스 도입","blanks":["쉬스","콘크리트 타설","삽입","그라우팅"],"page":87,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q038","q":"폭렬(Spalling)이란?","answer":"콘크리트 부재가 화재로 가열되어 표면부가 소리를 내며 급격히 파열되는 현상","blanks":["화재","표면부","파열"],"page":87,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q039","q":"매스콘크리트 수화열 저감대책을 쓰시오.","answer":"저열 시멘트 사용\n단위 시멘트량 감소\n타설온도 저하(프리쿨링, 파이프쿨링)","blanks":["저열 시멘트","단위 시멘트량","프리쿨링","파이프쿨링"],"page":87,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q040","q":"숏크리트(Shotcrete)의 장단점을 쓰시오.","answer":"장점: 시공성 우수, 가설공사 불필요\n단점: 표면 거칠고 균열 발생 우려, 분진 발생 및 재료낭비 심함","blanks":["시공성","가설공사","균열","분진"],"page":87,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q041","q":"콘크리트 압축강도 비파괴시험 방법을 쓰시오.","answer":"슈미트해머법\n초음파 속도법\n인발법\n조합법","blanks":["슈미트해머","초음파","인발법","조합법"],"page":87,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q042","q":"크리프(Creep) 현상이란?","answer":"하중의 증가 없이 시간의 경과에 따라 변형이 증가하는 콘크리트의 소성변형 현상","blanks":["하중의 증가 없이","시간의 경과","변형이 증가"],"page":87,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q043","q":"강구조 습식 내화피복공법의 종류를 쓰시오.","answer":"타설공법\n뿜칠공법\n미장공법\n조적공법","blanks":["타설","뿜칠","미장","조적"],"page":88,"category":"강구조","kind":"빈출","note":""},{"id":"q044","q":"강구조 습식 내화피복공법별 대표 재료를 쓰시오.","answer":"타설: 콘크리트·경량콘크리트\n뿜칠: 암면·플라스터\n미장: 철망퍼라이트·철망모르타르\n조적: 돌·벽돌","blanks":["경량콘크리트","암면","철망퍼라이트","벽돌"],"page":88,"category":"강구조","kind":"빈출","note":""},{"id":"q045","q":"강구조에서 내화피복이 필요한 이유는?","answer":"화재 발생 시 강재의 온도 상승 및 강도 저하를 방지하기 위해 강재 주위를 내화재료로 피복","blanks":["강재","온도 상승","강도 저하","내화재료"],"page":88,"category":"강구조","kind":"빈출","note":""},{"id":"q046","q":"고장력볼트 표준볼트장력과 설계볼트장력의 관계는?","answer":"현장시공에서 표준볼트장력은 설계볼트장력에 10%를 할증한 값","blanks":["표준볼트장력","설계볼트장력","10%"],"page":88,"category":"강구조","kind":"빈출","note":""},{"id":"q047","q":"용접 결함의 종류를 쓰시오.","answer":"슬래그감싸들기\n언더컷\n오버랩\n블로홀\n피트\n크레이터","blanks":["슬래그감싸들기","언더컷","오버랩","블로홀","피트","크레이터"],"page":89,"category":"강구조","kind":"빈출","note":""},{"id":"q048","q":"용접부 비파괴검사법의 종류를 쓰시오.","answer":"방사선투과법\n자기분말탐상법\n초음파탐상법\n침투탐상법","blanks":["방사선","자기분말","초음파","침투"],"page":89,"category":"강구조","kind":"빈출","note":""},{"id":"q049","q":"메탈터치(Metal touch)란?","answer":"강구조 기둥 이음부를 가공하여 상하부 기둥의 밀착을 좋게 하고 축력을 접촉면으로 직접 전달시키는 이음방법","blanks":["기둥 이음부","밀착","축력","직접"],"page":89,"category":"강구조","kind":"빈출","note":""},{"id":"q050","q":"엔드탭(End tab)의 용도를 쓰시오.","answer":"용접 결함이 생기기 쉬운 용접비드의 시작과 끝 지점에 부착하는 보조강판","blanks":["용접비드","시작과 끝","보조강판"],"page":89,"category":"강구조","kind":"빈출","note":""},{"id":"q051","q":"데크플레이트(Deck plate)란?","answer":"구조용강판을 절곡 제작하여 바닥콘크리트 타설을 위한 슬래브 하부 거푸집판으로 사용하는 것","blanks":["구조용강판","절곡","슬래브","거푸집판"],"page":89,"category":"강구조","kind":"빈출","note":""},{"id":"q052","q":"CFT 구조의 개념과 특징을 쓰시오.","answer":"강관 안에 콘크리트를 충전한 구조로 강관의 구속효과로 콘크리트 내력이 상승하고 강관의 국부좌굴을 억제","blanks":["강관","콘크리트를 충전","구속효과","국부좌굴"],"page":90,"category":"강구조","kind":"빈출","note":""},{"id":"q053","q":"SM355의 의미를 쓰시오.","answer":"SM: 용접구조용 압연강재\n355: 항복강도 Fy = 355MPa","blanks":["용접구조용","355MPa"],"page":90,"category":"강구조","kind":"빈출","note":""},{"id":"q054","q":"벽돌벽 백화현상 방지대책을 쓰시오.","answer":"흡수율이 작은 소성 잘 된 벽돌 사용\n줄눈모르타르에 방수제 혼합\n벽체표면에 발수제 도포\n차양 설치로 빗물 차단","blanks":["흡수율","방수제","발수제","차양"],"page":90,"category":"조적·석재·목재","kind":"빈출","note":""},{"id":"q055","q":"ALC 제조에 필요한 주재료 2가지는?","answer":"생석회\n규사","blanks":["생석회","규사"],"page":90,"category":"조적·석재·목재","kind":"빈출","note":""},{"id":"q056","q":"깨진 석재를 붙일 때 사용하는 접착제는?","answer":"에폭시 수지 접착제","blanks":["에폭시 수지"],"page":90,"category":"조적·석재·목재","kind":"빈출","note":""},{"id":"q057","q":"시트방수의 장단점을 쓰시오.","answer":"장점: 재료의 균일성, 바탕균열에 대한 내구성 및 내후성 우수\n단점: 재료비가 비싸고 접합부 처리 및 복잡한 부분 마감 어려움","blanks":["균일성","내구성","재료비","접합부"],"page":91,"category":"미장·타일·방수","kind":"빈출","note":""},{"id":"q058","q":"복층유리란?","answer":"건조 공기층을 사이에 두고 판유리를 이중 접합하고 테두리를 밀봉하여 단열 및 소음차단 성능을 향상시킨 유리","blanks":["건조 공기층","이중 접합","밀봉","단열"],"page":91,"category":"유리·커튼월","kind":"빈출","note":""},{"id":"q059","q":"강화유리의 제조 방법과 강도는?","answer":"판유리를 연화점까지 가열한 후 급냉하여 일반 유리의 3~5배 강도를 갖게 한 유리","blanks":["가열","급냉","3~5배"],"page":91,"category":"유리·커튼월","kind":"빈출","note":""},{"id":"q060","q":"로이유리(Low-E, 저방사유리)란?","answer":"열적외선을 반사하는 은 소재 도막을 코팅하여 방사율과 열관류율을 낮추고 가시광선투과율을 높인 유리","blanks":["열적외선","은","방사율","열관류율"],"page":92,"category":"유리·커튼월","kind":"빈출","note":""},{"id":"q061","q":"커튼월 공사의 목업 성능시험 항목 4가지는?","answer":"기밀성능시험\n수밀성능시험\n영구변형시험\n구조성능시험","blanks":["기밀","수밀","영구변형","구조성능"],"page":92,"category":"유리·커튼월","kind":"빈출","note":""},{"id":"q062","q":"메탈라스와 펀칭메탈을 구분하시오.","answer":"메탈라스: 얇은 철판에 자름금을 내어 당겨 늘린 것\n펀칭메탈: 얇은 철판에 각종 모양을 도려낸 것","blanks":["자름금","당겨","모양","도려낸"],"page":92,"category":"기타공사","kind":"빈출","note":""},{"id":"q063","q":"징두리벽이란?","answer":"수장공사 시 바닥에서 1~1.5m 높이까지 널을 댄 것","blanks":["수장공사","1~1.5m","널"],"page":92,"category":"기타공사","kind":"빈출","note":""},{"id":"q064","q":"LCC의 의미는?","answer":"Life Cycle Cost: 건축물의 초기단계부터 설계·시공·유지관리·해체에 이르는 일련의 과정과 제비용","blanks":["Life Cycle Cost","설계","유지관리","해체"],"page":92,"category":"건축시공총론","kind":"빈출","note":""},{"id":"q065","q":"공개경쟁입찰과 지명경쟁입찰의 차이는?","answer":"공개경쟁입찰: 입찰참가자를 공모하여 유자격자 모두에게 참가 기회를 주는 방식\n지명경쟁입 <div class="surface wide"><div class="flex"><div><div class="tiny muted">${fmtMonth(sel.date)} (${dayOf(sel.date)}) · 교재 ${sel.pages.length?`${Math.min(...sel.pages)}~${Math.max(...sel.pages)}쪽`:'누적 복습'}</div><h2 style="font-size:21px;letter-spacing:-.5px;margin:8px 0 5px">${safe(sel.title)}</h2><div class="hint">전체 공부 ${sel.totalMinutes}분 중 암기앱 권장 ${sel.appMinutes}분 · 나머지는 적산·구조 문제풀이${sel.date==='2026-11-04'?' 및 공정표 가벼운 복습':''}</div></div><button class="btn" onclick="sourceList()">자료 확인</button></div><hr class="divider"><div class="flex"><span class="tiny muted">등록된 개념 진도 ${progress}/${q.cards.length} · 목표 신규 ${sel.goal}개</span><span class="tiny muted">${q.cards.length?Math.round(progress/q.cards.length*100):0}%</span></div><div class="bar" style="margin:12px 0 22px"><div class="fill" style="width:${q.cards.length?Math.round(progress/q.cards.length*100):0}%"></div></div>${sel.kind!=='복습'?`<div class="btnrow"><button class="btn primary" onclick="startDaily()" ${available?'':'disabled'}>${available?'새 개념 학습 시작':'오늘 등록된 개념 학습 완료'}</button><button class="btn tonal" onclick="startReview()">전날·취약 복습 (${reviewQueue().length})</button></div><div class="hint" style="margin-top:15px">${sel.goal>q.cards.length?'현재 내장된 검수 카드 '+q.cards.length+'개입니다. 목표의 나머지는 문제은행에서 원문 확인 후 추가하세요.':'카드 순서는 원문 쪽수 순이며, 빈출 우선입니다.'}</div>`:`<div class="btnrow"><button class="btn primary" onclick="startReview()">취약 개념 복습</button><button class="btn" onclick="startRandom()">전체 랜덤 회상</button></div>`}</div>
<div class="sectionhead"><h2>13일 학습 캘린더</h2><span class="tiny muted">날짜를 눌러 분량 선택</span></div><div class="datecards">${PLAN.map(d=>{let dc=dayDone(d),tot=goalCards(d).cards.length;return `<button class="day ${d.date===data.selected?'active':''}" onclick="selectDay('${d.date}')"><div class="top"><span>${fmtMonth(d.date)} · ${dayOf(d.date)}</span><span>${d.date===today?'<span class="dot"></span> 오늘':''}</span></div><div class="title">${safe(d.title)}</div><div class="bottom">${d.kind==='복습'?'누적 복습':`${dc}/${tot}개 · ${d.appMinutes}분`}</div></button>`}).join('')}</div>
<div class="notice" style="margin-top:24px"><strong>학습 방식</strong> — 1단계 원문 따라 쓰기 → 2단계 핵심 빈칸만 입력 → 3단계 백지서술 → 직접 숙지도 평가. 다음날과 복습 예정일에는 정답을 가린 상태로 다시 풀게 됩니다. 진도는 이 브라우저에 자동 저장돼요.</div>`)}
function selectDay(d){data.selected=d;save();render()}
function sourceList(){const p=PLAN.find(x=>x.date===data.selected);modal={type:'source',pages:p?.pages??[]};render()}
function renderReview(){const list=reviewQueue(),master=countStatus('master'),weak=countStatus('weak'),unknown=countStatus('unknown');shell(`${head('SPACED REPETITION','전날 복습 & 취약 회독','전날 학습했거나 복습 예정일이 지난 개념을 모았습니다. 아직 잘 모르는 문제를 먼저 보여줍니다.')}
<div class="grid3"><div class="surface kpi"><div class="small">확실히 암기</div><div class="num">${master}</div></div><div class="surface kpi"><div class="small">더 숙지해야 함</div><div class="num">${weak}</div></div><div class="surface kpi"><div class="small">아직 잘 모름</div><div class="num">${unknown}</div></div></div><div class="surface wide"><h2 style="margin-top:0">오늘의 복습 대기</h2><p class="hint">완전 암기 → 4일 뒤, 더 숙지 → 2일 뒤, 잘 모름 → 다음날 복습 예정. 전날 학습한 개념은 분류와 무관하게 먼저 나타납니다.</p><div class="flex"><strong>${list.length}개 개념</strong><button class="btn primary" onclick="startReview()" ${list.length?'':'disabled'}>복습 시작</button></div><hr class="divider">${list.length?list.slice(0,25).map(c=>`<div class="item" style="margin:7px 0"><div><h3>${safe(c.q)}</h3><div class="meta">${safe(c.category)} · ${c.page}쪽 · ${pillStatus(pr(c.id).status)}</div></div><button class="btn" onclick="startOne('${c.id}','review')">풀기</button></div>`).join(''):'<div class="empty"><h3>현재 복습 대기가 없어요.</h3><p>새 개념을 학습하고 숙지도를 분류하면 여기에 쌓입니다.</p></div>'}</div>`)}
function renderRandom(){const learned=data.cards.filter(c=>pr(c.id).status!=='new');shell(`${head('CUMULATIVE RECALL','누적 랜덤 테스트','학습한 개념을 무작위로 풀어보세요. 잘 모르는 개념이 더 자주 나오도록 가중치를 두었습니다.')}
<div class="surface wide"><div style="display:flex;align-items:center;gap:20px;justify-content:space-between;flex-wrap:wrap"><div><div class="tiny muted">테스트 가능한 누적 개념</div><div style="font-size:42px;font-weight:760;margin-top:8px">${learned.length}<span class="tiny muted">개</span></div></div><div class="btnrow"><button class="btn primary" onclick="startRandom()" ${learned.length?'':'disabled'}>랜덤 테스트 시작</button></div></div><hr class="divider"><p class="hint">문제는 정답을 가린 백지서술 방식으로 출제합니다. 정답을 확인한 뒤 '확실히 / 더 숙지 / 잘 모름'으로 재분류하세요.</p><div class="notice">랜덤 복습은 이미 학습한 개념만 포함합니다. 신규 문제를 랜덤으로 열지 않으므로 배운 분량 안에서 실력을 확인할 수 있어요.</div></div>`)}
function renderBank(){const cats=uniq(data.cards.map(c=>c.category));const items=data.cards.filter(c=>[c.q,c.answer,c.category].join(' ').toLowerCase().includes(search.toLowerCase())).filter(c=>kindFilter==='전체 보기'||kindFilter===c.kind).filter(c=>catFilter==='전체'||catFilter===c.category).sort((a,b)=>Number(a.page)-Number(b.page));shell(`${head('QUESTION LIBRARY','개념 문제은행','PDF의 빈출 요약본(80~93쪽)과 전체 개념(12~78쪽)을 구분해 관리합니다. 원문과 대조하여 정답을 수정하거나 새 개념을 추가할 수 있어요.')}
<div class="toolbar"><input type="text" placeholder="개념·정답 검색" value="${safe(search)}" oninput="search=this.value;updateList()" id="searchText"><select onchange="kindFilter=this.value;updateList()">${['전체 보기','빈출','전체'].map(x=>`<option ${x===kindFilter?'selected':''}>${x}</option>`).join('')}</select><select onchange="catFilter=this.value;updateList()">${['전체',...cats].map(x=>`<option ${x===catFilter?'selected':''}>${safe(x)}</option>`).join('')}</select><button class="btn primary" onclick="openEditor()">+ 개념 추가</button></div>
<div class="flex tiny muted" style="margin-bottom:16px"><span>등록 ${data.cards.length}개 · 검색 결과 ${items.length}개</span><span>모든 문제 원문 쪽수 표시</span></div><div class="rows" id="bankList">${bankItems(items)}</div>`)}
function updateList(){const current=document.activeElement?.id==='searchText';const val=current?document.getElementById('searchText').value:search;search=val;renderBank();if(current){let el=document.getElementById('searchText');el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
function bankItems(items){return items.length?items.map(c=>`<div class="item"><div><div class="btnrow" style="gap:6px;margin-bottom:7px"><span class="chip">${c.kind}</span><span class="tiny muted">${safe(c.category)} · PDF ${c.page}쪽 · ${pillStatus(pr(c.id).status)}</span></div><h3>${safe(c.q)}</h3><div class="meta">정답 ${c.answer.split('\n').length}줄 · 빈칸 ${c.blanks.length}개</div></div><div class="actions"><button class="btn" onclick="startOne('${c.id}','learn')">학습</button><button class="btn" onclick="openEditor('${c.id}')">수정</button><button class="btn" onclick="openSource(${Number(c.page)})">원문</button></div></div>`).join(''):'<div class="empty">일치하는 개념이 없습니다.</div>'}
function renderSettings(){shell(`${head('MY STUDY DATA','학습 데이터 & 원문','암기 진행 상황은 브라우저에 저장되며, 백업 파일로 옮길 수 있습니다. 원본 PDF는 공개 저장소에 올리지 마세요.')}
<div class="surface wide"><h2 style="margin-top:0">원문 PDF 연결</h2><p class="hint">첨부한 '건축기사 실기 14개년 요약본' PDF를 선택하세요. 파일 자체는 외부에 업로드되지 않고 이 브라우저 탭에서만 열립니다. PDF 뷰어는 브라우저별로 동작이 다를 수 있어요.</p><div class="btnrow"><label class="btn" style="cursor:pointer">PDF 선택<input type="file" accept="application/pdf" style="display:none" onchange="loadPdf(this.files[0])"></label><span class="tiny muted">${pdfUrl?'PDF 연결됨':'현재 PDF 미연결'}</span></div><hr class="divider"><h2>백업 및 이동</h2><p class="hint">데이터 내보내기에는 등록 카드, 분류 기록, 선택 날짜가 모두 포함됩니다. 다른 기기에서 가져오면 이어서 공부할 수 있어요.</p><div class="btnrow"><button class="btn primary" onclick="exportJSON()">진도·문제은행 백업</button><label class="btn" style="cursor:pointer">백업 가져오기<input type="file" accept="application/json" style="display:none" onchange="importJSON(this.files[0])"></label><button class="btn" onclick="exportCSV()">문제은행 CSV 내보내기</button></div><hr class="divider"><h2>전체 초기화</h2><p class="hint">학습 기록과 직접 등록한 개념을 초기 카드 상태로 되돌립니다. 이 동작은 되돌릴 수 없습니다.</p><button class="btn warn" onclick="resetAll()">전체 초기화</button></div><div class="notice" style="max-width:890px;margin-top:18px">현재 내장 카드 ${STARTER_CARDS.length}개는 원문에서 확인한 학습용 시작 세트입니다. 전체 14개년 개념을 모두 전사한 데이터베이스는 아닙니다. 빠진 항목은 원문을 보며 문제은행에 등록하거나 JSON 백업 형식으로 추가하세요. 일부 문장은 타자학습을 위해 줄바꿈·표현을 간결하게 정리했습니다.</div>`)}
function loadPdf(file){if(!file)return;if(pdfUrl)URL.revokeObjectURL(pdfUrl);pdfUrl=URL.createObjectURL(file);render()}
function openSource(p){if(!pdfUrl){modal={type:'notpdf',page:p};render();return}modal={type:'pdf',page:p};render()}
function renderModal(){if(!modal)return '';let content='';if(modal.type==='pdf'){content=`<div class="flex"><h3>교재 원문 · ${modal.page}쪽</h3><button class="btn" onclick="closeModal()">닫기</button></div><div class="btnrow" style="margin-bottom:12px"><button class="btn" onclick="externalPdf(${modal.page})">새 탭에서 열기</button><span class="tiny muted">화면에 표시된 내용과 정답을 비교하세요.</span></div><iframe class="pdf-viewer" src="${pdfUrl}#page=${modal.page}&view=FitH"></iframe>`}
else if(modal.type==='notpdf'){content=`<h3>원문 PDF를 연결해 주세요</h3><p class="hint">문제의 출처는 교재 ${modal.page}쪽입니다. 설정에서 PDF를 선택하면 해당 쪽을 바로 열 수 있어요.</p><div class="btnrow"><label class="btn primary" style="cursor:pointer">PDF 선택<input type="file" accept="application/pdf" style="display:none" onchange="loadPdfAndOpen(this.files[0],${modal.page})"></label><button class="btn" onclick="closeModal()">닫기</button></div>`}
else if(modal.type==='source'){content=`<div class="flex"><h3>학습할 원문</h3><button class="btn" onclick="closeModal()">닫기</button></div><p class="hint">오늘 참고할 PDF 쪽수: ${modal.pages.length?Math.min(...modal.pages)+'~'+Math.max(...modal.pages):'누적 문제은행 전체'}</p><div class="btnrow"><button class="btn primary" onclick="openSource(${modal.pages[0]||80})">PDF 열기</button><button class="btn" onclick="closeModal()">닫기</button></div>`}
else if(modal.type==='edit'){content=editorHtml()}
return `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}
function closeModal(){modal=null;render()}function externalPdf(p){window.open(pdfUrl+'#page='+p,'_blank')}
function loadPdfAndOpen(f,p){if(!f)return;loadPdf(f);openSource(p)}
function openEditor(id=null){editId=id;modal={type:'edit'};render()}
function editorHtml(){const c=data.cards.find(x=>x.id===editId)||{q:'',answer:'',blanks:[],kind:'전체',category:'가설공사',page:12};const cats=uniq(data.cards.map(x=>x.category));return `<div class="flex"><h2 style="margin:0">${editId?'개념 수정':'새 개념 등록'}</h2><button class="btn" onclick="closeModal()">닫기</button></div><p class="hint">정답은 한 줄에 한 항목씩 입력하세요. 2단계에서 빈칸으로 만들 단어만 ' | '로 구분해 주세요.</p><form id="editor" class="formgrid" onsubmit="saveEditor(event)"><div class="field full"><label>문제</label><textarea name="q" required>${safe(c.q)}</textarea></div><div class="field full"><label>기준 정답 (한 줄에 한 항목)</label><textarea name="answer" required style="min-height:140px">${safe(c.answer)}</textarea></div><div class="field full"><label>빈칸 키워드 ( | 로 구분)</label><textarea name="blanks" style="min-height:55px">${safe(c.blanks.join(' | '))}</textarea></div><div class="field"><label>문제 분류</label><select name="kind">${['빈출','전체'].map(x=>`<option ${x===c.kind?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>교재 PDF 쪽수</label><input name="page" type="number" min="1" max="111" value="${c.page}" required></div><div class="field full"><label>공종</label><input name="category" list="catlist" value="${safe(c.category)}" required><datalist id="catlist">${cats.map(x=>`<option value="${safe(x)}">`).join('')}</datalist></div><div class="btnrow" style="grid-column:1/-1;justify-content:space-between;margin-top:9px"><div>${editId?'<button type="button" class="btn warn" onclick="removeCard()">카드 삭제</button>':''}</div><button class="btn primary" type="submit">저장하기</button></div></form>`}
function saveEditor(ev){ev.preventDefault();const f=new FormData(ev.target);const v={q:f.get('q').trim(),answer:f.get('answer').trim(),blanks:f.get('blanks').split('|').map(x=>x.trim()).filter(Boolean),kind:f.get('kind'),page:Number(f.get('page')),category:f.get('category').trim()};if(!v.q||!v.answer||!v.category)return; if(editId){Object.assign(data.cards.find(x=>x.id===editId),v)}else{v.id='local_'+Date.now();data.cards.push(v)}save();modal=null;view='bank';render()}
function removeCard(){if(!editId||!confirm('이 개념을 삭제할까요?'))return;data.cards=data.cards.filter(c=>c.id!==editId);delete data.progress[editId];save();modal=null;render()}
function exportJSON(){download('건축기사_암기루틴_백업_'+today+'.json',JSON.stringify({app:'건축기사 암기 루틴',version:2,exportedAt:today,...data},null,2),'application/json')}
function exportCSV(){const rows=[['구분','분류','PDF쪽','문제','정답','빈칸키워드'],...data.cards.map(c=>[c.kind,c.category,c.page,c.q,c.answer,c.blanks.join(' | ')])];download('건축기사_개념은행_'+today+'.csv','\ufeff'+rows.map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv')}
function download(fn,txt,type){const u=URL.createObjectURL(new Blob([txt],{type}));const el=document.createElement('a');el.href=u;el.download=fn;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function importJSON(file){if(!file)return;try{const j=JSON.parse(await file.text());if(!Array.isArray(j.cards)||!j.cards.every(c=>c.q&&c.answer&&c.id&&Array.isArray(c.blanks)))throw Error('올바른 개념 카드 파일이 아닙니다.');if(!confirm(j.cards.length+'개 카드와 진도 기록을 가져오시겠어요? 현재 데이터는 덮어쓰기됩니다.'))return;data={cards:j.cards,progress:j.progress||{},selected:j.selected||PLAN[0].date,settings:j.settings||{},version:2};save();render()}catch(e){alert('가져오기 실패: '+e.message)}}
function resetAll(){if(!confirm('학습 기록과 추가한 개념을 모두 초기화할까요?'))return;data=initial();save();render()}
function startDaily(){const d=PLAN.find(p=>p.date===data.selected);const list=goalCards(d).fresh; if(!list.length)return;startSession(list.slice(0,d.goal||99),'learn','new')}
function startReview(){const list=reviewQueue();if(list.length)startSession(list,'review','review');else alert('현재 복습 대상이 없습니다. 먼저 새 개념을 학습하세요.')}
function startRandom(){const learned=data.cards.filter(c=>pr(c.id).status!=='new');if(!learned.length)return;const weighted=learned.map(c=>{let p=pr(c.id);return{c,w:p.status==='unknown'?5:p.status==='weak'?3:1}});let bag=[];for(const o of weighted)for(let i=0;i<o.w;i++)bag.push(o.c);let chosen=[],seen=new Set();while(bag.length&&chosen.length<Math.min(20,learned.length)){const i=Math.floor(Math.random()*bag.length);const c=bag[i];bag=bag.filter(x=>x.id!==c.id);if(!seen.has(c.id)){chosen.push(c);seen.add(c.id)}}startSession(chosen,'random','random')}
function startOne(id,mode){const c=data.cards.find(x=>x.id===id);if(c)startSession([c],mode,mode)}
function startSession(cards,mode,label){session={ids:cards.map(c=>c.id),idx:0,stage:mode==='learn'?1:3,mode,label,typed:'',free:'',blank:[],revealed:false,checked:false,hint:false};render()}
function activeCard(){return data.cards.find(c=>c.id===session.ids[session.idx])}
function renderSession(){const c=activeCard();if(!c){session=null;render();return}let st=session.stage;const isLearn=session.mode==='learn';let steps=isLearn?`<div class="stepbar">${[[1,'01 따라 쓰기'],[2,'02 핵심 빈칸'],[3,'03 백지서술']].map(([i,s])=>`<span class="step ${i===st?'active':i<st?'done':''}">${s}</span>`).join('')}</div>`:`<div class="stepbar"><span class="step active">${session.mode==='random'?'05 누적 랜덤':'04 전날·취약 복습'} · 백지서술</span></div>`;
let inner='';if(st===1){const words=c.answer.replaceAll('\n','');let t=norm(session.typed),ans=norm(words);const pct=Math.min(100,Math.round(100*t.length/Math.max(ans.length,1)));const match=t.length>0?Math.round([...t].filter((ch,i)=>ans[i]===ch).length/Math.max(t.length,1)*100):0;inner=`<div class="tiny strong" style="margin-bottom:12px">기준 정답을 보면서 직접 따라 쓰세요.</div><div class="answerBox">${safe(c.answer)}</div><textarea class="typeInput" id="typing" placeholder="이곳에 기준 정답을 직접 입력하세요." oninput="session.typed=this.value;typingLive()">${safe(session.typed)}</textarea><div class="flex" style="margin:12px 0 18px"><div class="tiny muted" id="live">입력 분량 ${pct}% · 글자별 일치 ${match}% (참고용)</div><div class="tiny muted">읽기만 하지 않고 손으로 입력하기</div></div><button class="btn primary" onclick="advance()">2단계 빈칸 채우기로 <span aria-hidden="true">→</span></button>`}
else if(st===2){let segments=blankMarkup(c);inner=`<div class="tiny strong" style="margin-bottom:12px">빈칸으로 표시된 부분만 입력하면 됩니다.</div><div class="answerBox" id="blankArea">${segments.html}</div><p class="hint">정답 원문의 나머지 문장은 이미 표시되어 있어요. 짧은 단어는 옆으로 배열했습니다.</p>${session.hint?`<div class="feedback">앞글자 힌트: ${safe(c.blanks.map(k=>k[0]||'').join(' · '))}</div>`:''}${session.checked?`<div class="feedback">${segments.found}개 빈칸 중 ${countCorrectBlanks(c)}개 정답 · 정답 예시: ${safe(c.blanks.join(' / '))}</div>`:''}<div class="btnrow" style="margin-top:18px"><button class="btn" onclick="session.hint=!session.hint;renderSession()">힌트 ${session.hint?'접기':'보기'}</button><button class="btn" onclick="checkBlanks()">빈칸 채점·기준 확인</button><button class="btn primary" onclick="advance()">3단계 백지서술로 <span aria-hidden="true">→</span></button></div>`}
else{const p=pr(c.id);inner=`<div class="tiny strong" style="margin-bottom:12px">아무것도 보지 않고 시험답안처럼 작성하세요.</div><textarea class="freeInput" id="freeInput" placeholder="머릿속에서 정답을 꺼내 백지에 서술하세요." oninput="session.free=this.value">${safe(session.free)}</textarea><div class="btnrow" style="margin:15px 0"><button class="btn" onclick="session.hint=!session.hint;renderSession()">힌트 ${session.hint?'접기':'보기'}</button><button class="btn primary" onclick="reveal()">${session.revealed?'기준내용 다시 확인':'채점 / 기준내용 확인'}</button><span class="tiny muted">자동 채점은 키워드 참고용이며 최종 평가는 직접 선택합니다.</span></div>${session.hint?`<div class="feedback">앞글자 힌트: ${safe(c.blanks.map(k=>k[0]||'').join(' · '))}</div>`:''}${session.revealed?`<div class="answerBox">${safe(c.answer)}</div><div class="keyhits">${c.blanks.map(k=>`<span class="${norm(session.free).includes(norm(k))?'hit':''}">${safe(k)}</span>`).join('')}</div><p class="hint" style="margin-top:11px">녹색 = 작성한 답안에 포함된 키워드 (띄어쓰기 무시). 동의어·서술형 의미까지 자동 판정하지는 않습니다.</p><div class="sectionhead" style="margin:21px 0 10px"><h2>기억 상태는 어땠나요?</h2></div><div class="assess"><button onclick="rate('master')"><strong>확실히 암기한 것</strong><div class="small">기준답안을 스스로 재현함 · 4일 뒤</div></button><button onclick="rate('weak')"><strong>더 숙지해야 될 것</strong><div class="small">일부 핵심 누락 · 2일 뒤</div></button><button onclick="rate('unknown')"><strong>아직 잘 모르는 것</strong><div class="small">거의 쓰지 못함 · 다음날</div></button></div>`:''}`}
shell(`<div class="flex" style="margin-bottom:22px"><button class="btn" onclick="session=null;render()">← 나가기</button><div class="tiny muted">${session.idx+1} / ${session.ids.length}개념</div></div><div class="studybox">${steps}<div class="surface"><div class="flex"><span class="chip">${safe(c.kind)} · ${safe(c.category)}</span><button class="btn" onclick="openSource(${Number(c.page)})">교재 ${c.page}쪽 <span aria-hidden="true">↗</span></button></div><div class="qnum" style="margin-top:17px">QUESTION ${String(session.idx+1).padStart(2,'0')}</div><h2 class="question">${safe(c.q)}</h2>${inner}</div><p class="hint" style="margin-top:19px">학습 기준답안은 원문을 바탕으로 작성된 학습용 문장입니다. 정확한 표현이 필요하면 해당 PDF쪽에서 직접 대조 후 문제은행에서 수정하세요.</p></div>`);
if(st===1){let el=document.getElementById('typing');if(el){el.setSelectionRange(el.value.length,el.value.length)}}}
function typingLive(){const c=activeCard();const t=norm(session.typed),a=norm(c.answer);document.getElementById('live').textContent=`입력 분량 ${Math.min(100,Math.round(t.length/Math.max(a.length,1)*100))}% · 글자별 일치 ${t.length?Math.round([...t].filter((ch,i)=>a[i]===ch).length/t.length*100):0}% (참고용)`}
function advance(){if(session.stage<3){if(session.stage===1&&session.typed.trim().length===0&&!confirm('따라 쓰기를 하지 않았습니다. 다음 단계로 이동할까요?'))return;session.stage++;session.checked=false;session.hint=false;renderSession()}}
function blankMarkup(c){
 const keys=c.blanks.map(x=>String(x).trim()).filter(Boolean),used=new Set();let found=0;const lines=c.answer.split('\n');let out=[],shortGroup=[];
 function flush(){if(shortGroup.length){out.push(`<div class="answerRow short">${shortGroup.join('')}</div>`);shortGroup=[]}}
 for(const line of lines){let parts=[{text:line,type:'text'}];
  for(let ki=0;ki<keys.length;ki++){if(used.has(ki))continue;const k=keys[ki],next=[];let replaced=false;
   for(const p of parts){if(p.type!=='text'||replaced){next.push(p);continue}const ix=p.text.indexOf(k);if(ix<0){next.push(p);continue}next.push({text:p.text.slice(0,ix),type:'text'},{text:k,type:'blank',i:found},{text:p.text.slice(ix+k.length),type:'text'});replaced=true}
   if(replaced){parts=next;used.add(ki);found++}
  }
  const piece=`<div class="line">${parts.map(p=>p.type==='text'?safe(p.text).replaceAll(' ','&nbsp;'):`<input class="blankInput" data-idx="${p.i}" data-key="${safe(p.text)}" style="width:${Math.max(9,Math.min(23,p.text.length+4))}ch" aria-label="핵심 빈칸 ${p.i+1}" value="${safe(session.blank[p.i]||'')}" oninput="session.blank[${p.i}]=this.value">`).join('')}</div>`;
  if(norm(line).length<18){shortGroup.push(piece)}else{flush();out.push(`<div class="answerRow">${piece}</div>`)}
 }
 flush();if(!found)return{html:`<div class="hint">설정된 빈칸 키워드가 본문과 일치하지 않습니다. 문제은행에서 해당 카드를 수정해 주세요.</div><div>${safe(c.answer)}</div>`,found};
 return{html:out.join(''),found}
}
function countCorrectBlanks(c){let all=Array.from(document.querySelectorAll('.blankInput'));return all.filter(el=>norm(el.value)===norm(el.dataset.key)).length}
function checkBlanks(){session.checked=true;const inputs=[...document.querySelectorAll('.blankInput')];let good=0;inputs.forEach(el=>{const ok=norm(el.value)===norm(el.dataset.key);good+=Number(ok);el.classList.toggle('right',ok);el.classList.toggle('wrong',!ok)});const fb=document.createElement('div');fb.className='feedback';fb.textContent=`정답 ${good}/${inputs.length}개 · 빈칸 기준어: ${inputs.map(x=>x.dataset.key).join(' / ')}`;document.getElementById('blankArea').after(fb)}
function reveal(){session.free=document.getElementById('freeInput').value;session.revealed=true;renderSession()}
function rate(s){const c=activeCard(),p=pr(c.id);const days=s==='master'?4:s==='weak'?2:1;data.progress[c.id]={...p,status:s,due:plusDays(today,days),last:today,first:p.first||today,count:(p.count||0)+1,reviewCount:(p.reviewCount||0)+(session.mode==='learn'?0:1)};save();session.idx++;if(session.idx>=session.ids.length){const length=session.ids.length;session=null;view='today';render();alert(`${length}개념 학습/복습을 마쳤어요. 진행 상황을 저장했습니다.`)}else{session.stage=session.mode==='learn'?1:3;session.typed='';session.free='';session.blank=[];session.checked=false;session.revealed=false;session.hint=false;renderSession()}}
render();
</script></body></html>
