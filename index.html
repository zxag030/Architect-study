<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>건축기사 · 암기 루틴</title><style>
:root{--ink:#222725;--sub:#737a75;--line:#e7e8e4;--bg:#f6f7f4;--paper:#fff;--accent:#315f50;--mist:#e9f2ed;--alert:#ae663f;--light:#fff7f1}*{box-sizing:border-box}html,body{margin:0;font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100dvh}.sidebar{padding:35px 20px 20px 27px;background:#fff;border-right:1px solid var(--line);position:sticky;top:0;height:100dvh}.brand{font-weight:750;letter-spacing:-.6px;font-size:21px;margin-bottom:3px}.brand-caption{font-size:11px;letter-spacing:1.3px;color:var(--sub)}.nav{display:grid;gap:5px;margin-top:58px}.nav button{border:0;background:none;border-radius:10px;text-align:left;padding:13px 15px;font-size:14px;color:#676c69;font-weight:600}.nav button.active{color:var(--accent);background:var(--mist)}.aside-bottom{position:absolute;bottom:25px;left:27px;right:25px;color:var(--sub);font-size:12px;line-height:1.7}.main{max-width:1200px;width:100%;margin:0 auto;padding:44px 48px 90px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.heading{font-size:32px;line-height:1.3;letter-spacing:-1.2px;margin:12px 0 8px;font-weight:760}.sub{font-size:14px;color:var(--sub);line-height:1.7;margin:0 0 28px}.surface{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 2px 6px #172a1903}.wide{max-width:890px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.kpi .small{color:var(--sub);font-size:12px}.kpi .num{font-size:27px;letter-spacing:-.8px;font-weight:700;margin-top:11px}.kpi .meta{font-size:12px;color:var(--sub);margin-top:5px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:36px 0 15px}.sectionhead h2{font-size:18px;margin:0;letter-spacing:-.4px}.btn{border-radius:10px;border:1px solid var(--line);padding:11px 16px;background:#fff;font-size:13px;font-weight:650;color:var(--ink)}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn.tonal{background:var(--mist);color:var(--accent);border-color:transparent}.btn.warn{background:var(--light);color:var(--alert)}.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.muted{color:var(--sub)}.tiny{font-size:12px}.strong{font-weight:730}.datecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}.day{border:1px solid var(--line);border-radius:12px;padding:15px;background:white;text-align:left;min-height:128px}.day.active{border-color:var(--accent);box-shadow:0 0 0 2px #315f5016}.day .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub)}.day .title{font-size:14px;font-weight:700;margin-top:13px;line-height:1.55}.day .bottom{font-size:12px;color:var(--sub);margin-top:12px}.day .dot{display:inline-block;width:6px;height:6px;background:var(--accent);border-radius:50%}.bar{background:#e9ebe7;height:7px;border-radius:30px;overflow:hidden}.fill{background:var(--accent);height:100%;transition:width .25s}.studybox{max-width:780px}.stepbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.step{font-size:12px;padding:7px 11px;border-radius:20px;background:#edf0ec;color:#7b837d;font-weight:650}.step.active{background:var(--accent);color:white}.step.done{background:var(--mist);color:var(--accent)}.qnum{color:var(--sub);font-size:12px}.question{font-size:23px;font-weight:750;line-height:1.55;letter-spacing:-.5px;margin:16px 0 24px}.answerBox{border:1px solid var(--line);border-radius:11px;padding:20px;background:#fafbf9;white-space:pre-wrap;line-height:1.95;font-size:15px}.typeInput,.freeInput,textarea,input[type=text],input[type=number],select{border:1px solid #daddd7;border-radius:9px;padding:11px 13px;background:#fff;outline:none;color:var(--ink)}.typeInput:focus,.freeInput:focus,textarea:focus,input:focus,select:focus{border-color:#729b89;box-shadow:0 0 0 3px #e6f0e9}.typeInput,.freeInput{width:100%;margin-top:14px;min-height:160px;resize:vertical;line-height:1.8}.freeInput{min-height:210px}.answerRow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:5px 0}.answerRow.short{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:11px}.answerRow .line{font-size:14px;line-height:2.3}.blankInput{height:34px;min-width:85px;max-width:100%;border:0;border-bottom:2px solid #9baca1;border-radius:0;background:#f4f7f4;font-size:14px;padding:2px 7px;vertical-align:middle}.blankInput.right{border-bottom-color:#46846b;background:#e8f4ec}.blankInput.wrong{border-bottom-color:#d49476;background:#fff3ec}.assess{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}.assess button{padding:14px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left}.assess button:hover{border-color:var(--accent)}.assess .small{font-size:11px;color:var(--sub);margin-top:5px}.chip{font-size:11px;color:var(--accent);background:var(--mist);border-radius:40px;padding:6px 10px;font-weight:700}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.divider{border:0;border-top:1px solid var(--line);margin:22px 0}.hint{font-size:13px;color:var(--sub);line-height:1.8}.feedback{margin-top:14px;background:#edf4ef;color:#375d4e;border-radius:9px;padding:10px 14px;font-size:13px;line-height:1.7}.feedback.warn{background:#fff6ee;color:#97613e}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 18px}.toolbar input{flex:1;min-width:150px}.toolbar select{min-width:130px}.rows{display:grid;gap:9px}.item{padding:15px 18px;border-radius:11px;background:white;border:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between}.item h3{margin:0 0 6px;font-size:14px}.item .meta{color:var(--sub);font-size:12px;line-height:1.5}.item .actions{display:flex;flex-wrap:wrap;gap:6px}.item .actions button{padding:7px 9px;font-size:11px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field label{font-size:12px;font-weight:700;color:#595f5b}.field.full{grid-column:1/-1}.field textarea{min-height:120px;resize:vertical;line-height:1.7}.notice{background:#f3f7f2;border:1px solid #e1eae3;border-radius:11px;padding:14px 16px;font-size:13px;line-height:1.7}.empty{text-align:center;padding:50px 20px;color:var(--sub)}.empty h3{color:var(--ink)}.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}.pill{border:1px solid var(--line);border-radius:30px;background:white;padding:9px 12px;font-size:12px}.pill.active{background:var(--accent);color:white;border-color:var(--accent)}.pdf-viewer{width:100%;height:62vh;border:0;border-radius:10px;background:#fff}.overlay{position:fixed;inset:0;background:#1b2a2399;z-index:10;display:flex;align-items:center;justify-content:center;padding:15px}.modal{width:min(730px,100%);max-height:90vh;overflow:auto;background:white;border-radius:16px;padding:22px}.keyhits{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.keyhits span{border-radius:20px;padding:6px 10px;font-size:12px;background:#f6ece8;color:#a16b4e}.keyhits span.hit{background:var(--mist);color:var(--accent)}@media(max-width:780px){.app{display:block}.sidebar{position:sticky;top:0;height:auto;padding:12px 18px;background:#fff;z-index:5;display:flex;align-items:center;gap:12px;justify-content:space-between}.brand{font-size:15px;margin:0}.brand-caption,.aside-bottom{display:none}.nav{display:flex;margin:0;gap:2px;overflow:auto}.nav button{white-space:nowrap;font-size:12px;padding:9px 8px}.main{padding:26px 18px 80px}.heading{font-size:27px}.surface{padding:18px}.grid3{gap:7px}.kpi .num{font-size:22px}.kpi .meta{display:none}.assess{grid-template-columns:1fr}.assess button{padding:12px}.formgrid{grid-template-columns:1fr}.question{font-size:20px}.item{align-items:flex-start;flex-direction:column}.toolbar>*{width:100%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.daily-progress{margin-bottom:26px}.daily-progress h2{font-size:18px;margin:0}.daily-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0}.daily-metrics strong{display:block;font-size:26px;color:var(--accent);margin-top:8px}.daily-progress .hint{margin-bottom:0}@media(max-width:1024px) and (min-width:781px){.app{grid-template-columns:190px minmax(0,1fr)}.main{padding:32px 24px}.sidebar{padding-left:18px}.brand{font-size:18px}}@media(max-width:480px){.daily-metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.daily-metrics strong{font-size:24px}}.pdf-scroll{overflow:auto;height:55vh;max-height:60vh;background:#edf0ec;border-radius:10px;margin-top:12px;min-height:150px}.pdf-scroll canvas[hidden]{display:none}.pdf-scroll canvas{display:block;margin:auto;max-width:100%;height:auto}.pdf-controls .btn{min-height:44px}.pdf-controls input{width:85px;min-height:44px}.pdf-status{white-space:pre-wrap}.pdf-name{overflow-wrap:anywhere}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}@media(max-width:900px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><div id="root"></div><script>
const STARTER_CARDS=[{"id":"q001","q":"시공계획서 제출 시 환경관리 및 친환경관리에 대해 제출할 서류를 쓰시오.","answer":"건설폐기물 저감 및 재활용계획\n산업부산물 재활용계획\n온실가스 배출 저감 계획\n천연자원 사용 저감 계획\n수자원활용 계획\n작업장, 대지 및 대지 주변의 환경관리계획","blanks":["건설폐기물","산업부산물","온실가스","천연자원","수자원","환경관리계획"],"page":80,"category":"가설공사","kind":"빈출","note":""},{"id":"q002","q":"기준점의 설치목적을 쓰시오.","answer":"공사 중 높이 기준을 정하기 위해 설치하는 원점","blanks":["높이 기준","원점"],"page":80,"category":"가설공사","kind":"빈출","note":""},{"id":"q003","q":"기준점 설치 시 주의사항 3가지를 쓰시오.","answer":"지면 0.5m~1m 위로 공사에 지장 없게 설치\n이동 염려가 없는 곳에 설치\n필요하면 보조기준점 1~2개소 이상 설치","blanks":["0.5m~1m","이동 염려","보조기준점"],"page":80,"category":"가설공사","kind":"빈출","note":""},{"id":"q004","q":"방호선반이란 무엇인가?","answer":"상부에서 작업 도중 자재나 공구 등 낙하피해를 방지하기 위해 벽체나 비계 외부에 설치하는 금속판재","blanks":["낙하피해","금속판재"],"page":80,"category":"가설공사","kind":"빈출","note":""},{"id":"q005","q":"예민비의 정의와 식을 쓰시오.","answer":"식: 자연시료의 강도 / 이긴시료의 강도\n점토에서 자연시료를 함수율 변화 없이 이기면 약해지는 정도를 표시한 것","blanks":["자연시료의 강도","이긴시료의 강도","함수율"],"page":80,"category":"토공사","kind":"빈출","note":""},{"id":"q006","q":"보링의 종류 4가지를 쓰시오.","answer":"오우거 보링\n수세식 보링\n회전식 보링\n충격식 보링","blanks":["오우거","수세식","회전식","충격식"],"page":80,"category":"토공사","kind":"빈출","note":""},{"id":"q007","q":"회전식 보링의 특징을 쓰시오.","answer":"지층 변화를 연속적·비교적 정확히 알고자 할 때 사용\n중경날 회전 천공\n토층 흐트러질 우려 적음","blanks":["지층 변화","회전 천공","흐트러질 우려"],"page":80,"category":"토공사","kind":"빈출","note":""},{"id":"q008","q":"충격식 보링의 특징을 쓰시오.","answer":"경질층에 적합\n충격날을 60~70cm 낙하\n낙하 충격으로 파쇄된 토사를 퍼 지층 상태 판단","blanks":["경질층","60~70cm","낙하 충격"],"page":81,"category":"토공사","kind":"빈출","note":""},{"id":"q009","q":"수세식 보링의 특징을 쓰시오.","answer":"수압을 이용하여 연질층 탐사\n외경 50~60mm 관 이용\n흙과 물을 동시 배출","blanks":["수압","연질층","흙과 물"],"page":81,"category":"토공사","kind":"빈출","note":""},{"id":"q010","q":"안정액 벤토나이트의 기능 3가지를 쓰시오.","answer":"굴착벽면 붕괴방지\n굴착토사 분리배출\n부유물 침전방지","blanks":["붕괴방지","분리배출","침전방지"],"page":81,"category":"토공사","kind":"빈출","note":""},{"id":"q011","q":"SPS 공법의 특징을 쓰시오.","answer":"가설지지체 설치 및 해체공정 불필요\n작업공간 확보\n지반상태에 상관없이 시공 가능\n지상공사와 병행 가능하여 공기단축 가능","blanks":["가설지지체","작업공간","지반상태","공기단축"],"page":81,"category":"토공사","kind":"빈출","note":""},{"id":"q012","q":"톱다운(Top-down) 공법의 특징을 쓰시오.","answer":"1층 슬래브를 먼저 타설하여 작업공간 활용\n지상·지하 동시시공하여 공기단축 용이\n날씨에 무관하게 공사 진행\n주변 지반 영향이 적음","blanks":["1층 슬래브","지상·지하","날씨","주변 지반"],"page":81,"category":"토공사","kind":"빈출","note":""},{"id":"q013","q":"히빙(Heaving) 현상이란?","answer":"흙막이 벽 내외측의 토압 차이 등으로 굴착 저면의 흙이 솟아오르는 현상","blanks":["굴착 저면","솟아오르는"],"page":82,"category":"토공사","kind":"빈출","note":""},{"id":"q014","q":"보일링(Boiling) 현상이란?","answer":"흙막이 뒷면 수위가 높아 지하수가 흙막이 벽 밑을 지나 공사장 안 바닥에서 모래와 함께 솟아오르는 현상","blanks":["지하수","흙막이 벽 밑","모래"],"page":82,"category":"토공사","kind":"빈출","note":""},{"id":"q015","q":"히빙·보일링 방지대책을 쓰시오.","answer":"흙막이 벽 근입장 증가\n배수공법으로 지하수위 저하\n지반 개량으로 전단강도 증가\n굴착 작업은 흙막이 부재 설치에 필요한 최소 깊이만 실시","blanks":["근입장","지하수위","전단강도","최소 깊이"],"page":82,"category":"토공사","kind":"빈출","note":""},{"id":"q016","q":"지정(地定)이란?","answer":"기초판을 지지하기 위해 그 아래에 설치하는 버림콘크리트, 잡석, 말뚝 등","blanks":["기초판","버림콘크리트","잡석","말뚝"],"page":82,"category":"지정·기초","kind":"빈출","note":""},{"id":"q017","q":"지하구조물 부상 방지대책 4가지를 쓰시오.","answer":"차수공법으로 물 차단\n강제 배수\n구조물 자중 증대\n락앵커 공법 사용","blanks":["차수","배수","자중","락앵커"],"page":82,"category":"지정·기초","kind":"빈출","note":""},{"id":"q018","q":"샌드드레인 공법의 원리를 쓰시오.","answer":"점토질 지반에 구멍을 뚫어 모래를 넣고 성토 등의 하중을 가하여 압밀을 촉진하는 공법","blanks":["점토질","모래","성토","압밀"],"page":83,"category":"지정·기초","kind":"빈출","note":""},{"id":"q019","q":"압밀과 다짐의 차이를 쓰시오.","answer":"압밀: 점토질 지반에 외력이 작용하여 간극수가 배출되는 현상\n다짐: 사질 지반에 외력이 작용하여 공기가 빠지며 압축되는 현상","blanks":["점토질","간극수","사질","공기"],"page":83,"category":"지정·기초","kind":"빈출","note":""},{"id":"q020","q":"부동침하 방지대책을 쓰시오.","answer":"마찰말뚝 사용\n지하실 설치\n기초 상호 간 연결\n언더피닝 공법 적용","blanks":["마찰말뚝","지하실","기초","언더피닝"],"page":83,"category":"지정·기초","kind":"빈출","note":""},{"id":"q021","q":"언더피닝 공법의 목적을 쓰시오.","answer":"기존 건축물의 기초를 보강하거나 인접 건물에 침하·균열 등의 피해를 예방하기 위한 기초보강 방법","blanks":["기초보강","침하","균열"],"page":83,"category":"지정·기초","kind":"빈출","note":""},{"id":"q022","q":"철근의 기본 이음 방법 3가지를 쓰시오.","answer":"겹침이음\n용접이음\n기계식 이음(연결재 사용)","blanks":["겹침이음","용접이음","기계식 이음"],"page":83,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q023","q":"철근 간격을 유지하는 목적 3가지를 쓰시오.","answer":"콘크리트 유동성 확보\n소요강도 확보\n재료분리 방지","blanks":["유동성","소요강도","재료분리"],"page":84,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q024","q":"철근 부식에 대한 방청 조치를 쓰시오.","answer":"에폭시 코팅철근 사용\n철근 표면 아연도금 처리\n골재에 제염제 혼입\n콘크리트에 방청제 혼입","blanks":["에폭시","아연도금","제염제","방청제"],"page":84,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q025","q":"갱폼(Gang form)의 장단점을 쓰시오.","answer":"장점: 조립 및 해체작업 생략, 노동력 절감 및 공기 단축\n단점: 제작·해체 후 보관장소 필요, 초기 투자비가 재래식보다 높음","blanks":["조립","노동력","보관장소","초기 투자비"],"page":84,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q026","q":"슬립폼(Slip form)이란?","answer":"거푸집을 연속 이동하며 콘크리트를 타설하는 공법으로 시공이음 없는 균일 시공이 가능하며 수직 연속 구조물에 활용","blanks":["연속 이동","시공이음","수직"],"page":84,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q027","q":"트래블링폼(Traveling form)이란?","answer":"트래블러 장치를 이용해 수평 이동이 가능한 대형 시스템 거푸집으로 터널이나 지하철 공사에 적용","blanks":["수평 이동","터널","지하철"],"page":85,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q028","q":"터널폼(Tunnel form)이란?","answer":"한 구획의 벽판과 바닥판을 ㄱ자형 또는 ㄷ자형으로 짠 거푸집","blanks":["벽판","바닥판","ㄱ자형","ㄷ자형"],"page":85,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q029","q":"와플폼(Waffle form)이란?","answer":"무량판 구조에서 2방향 장선 바닥판 구조가 가능하도록 한 특수한 상자 모양의 기성재 거푸집","blanks":["무량판","2방향 장선","상자"],"page":85,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q030","q":"스페이서와 세퍼레이터의 용도를 구분하시오.","answer":"스페이서: 철근의 피복두께 유지\n세퍼레이터: 거푸집이 오므라드는 것을 방지하여 간격 유지","blanks":["피복두께","오므라드는","간격"],"page":85,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q031","q":"알칼리 골재반응 방지대책을 쓰시오.","answer":"알칼리 함량 0.6% 이하 시멘트 사용\n반응에 무해한 골재 사용\n플라이애시·고로슬래그 등 양질의 혼화재 사용","blanks":["0.6%","무해한 골재","플라이애시","고로슬래그"],"page":85,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q032","q":"물시멘트비의 정의를 쓰시오.","answer":"시멘트 중량에 대한 유효수량의 중량 백분율","blanks":["시멘트 중량","유효수량","백분율"],"page":85,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q033","q":"콜드조인트(Cold joint)란?","answer":"콘크리트 이어치기 시간 경과로 콘크리트가 일체화되지 않아 발생하는 계획되지 않은 이음","blanks":["이어치기","일체화","계획되지 않은"],"page":86,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q034","q":"레미콘 표기 25-24-150의 의미는?","answer":"25: 굵은골재 최대치수 25mm\n24: 호칭강도 24MPa\n150: 소요 슬럼프값 150mm","blanks":["굵은골재","호칭강도","슬럼프"],"page":86,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q035","q":"레미콘 현장 품질 확인사항을 쓰시오.","answer":"슬럼프 시험\n공기량 시험\n공시체 압축강도 시험\n염화물 함유량 측정\n온도 측정","blanks":["슬럼프","공기량","압축강도","염화물","온도"],"page":86,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q036","q":"프리텐셔닝(Pre-tensioning) 공법의 순서를 쓰시오.","answer":"PS 강재 긴장 → 콘크리트 타설 → PS 강재와 콘크리트 접합 → 프리스트레스 도입","blanks":["PS 강재 긴장","콘크리트 타설","접합","프리스트레스"],"page":87,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q037","q":"포스트텐셔닝(Post-tensioning) 공법의 순서를 쓰시오.","answer":"쉬스 설치 → 콘크리트 타설 → PS 강재 삽입·긴장·고정 → 그라우팅 → 프리스트레스 도입","blanks":["쉬스","콘크리트 타설","삽입","그라우팅"],"page":87,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q038","q":"폭렬(Spalling)이란?","answer":"콘크리트 부재가 화재로 가열되어 표면부가 소리를 내며 급격히 파열되는 현상","blanks":["화재","표면부","파열"],"page":87,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q039","q":"매스콘크리트 수화열 저감대책을 쓰시오.","answer":"저열 시멘트 사용\n단위 시멘트량 감소\n타설온도 저하(프리쿨링, 파이프쿨링)","blanks":["저열 시멘트","단위 시멘트량","프리쿨링","파이프쿨링"],"page":87,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q040","q":"숏크리트(Shotcrete)의 장단점을 쓰시오.","answer":"장점: 시공성 우수, 가설공사 불필요\n단점: 표면 거칠고 균열 발생 우려, 분진 발생 및 재료낭비 심함","blanks":["시공성","가설공사","균열","분진"],"page":87,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q041","q":"콘크리트 압축강도 비파괴시험 방법을 쓰시오.","answer":"슈미트해머법\n초음파 속도법\n인발법\n조합법","blanks":["슈미트해머","초음파","인발법","조합법"],"page":87,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q042","q":"크리프(Creep) 현상이란?","answer":"하중의 증가 없이 시간의 경과에 따라 변형이 증가하는 콘크리트의 소성변형 현상","blanks":["하중의 증가 없이","시간의 경과","변형이 증가"],"page":87,"category":"철근콘크리트","kind":"빈출","note":""},{"id":"q043","q":"강구조 습식 내화피복공법의 종류를 쓰시오.","answer":"타설공법\n뿜칠공법\n미장공법\n조적공법","blanks":["타설","뿜칠","미장","조적"],"page":88,"category":"강구조","kind":"빈출","note":""},{"id":"q044","q":"강구조 습식 내화피복공법별 대표 재료를 쓰시오.","answer":"타설: 콘크리트·경량콘크리트\n뿜칠: 암면·플라스터\n미장: 철망퍼라이트·철망모르타르\n조적: 돌·벽돌","blanks":["경량콘크리트","암면","철망퍼라이트","벽돌"],"page":88,"category":"강구조","kind":"빈출","note":""},{"id":"q045","q":"강구조에서 내화피복이 필요한 이유는?","answer":"화재 발생 시 강재의 온도 상승 및 강도 저하를 방지하기 위해 강재 주위를 내화재료로 피복","blanks":["강재","온도 상승","강도 저하","내화재료"],"page":88,"category":"강구조","kind":"빈출","note":""},{"id":"q046","q":"고장력볼트 표준볼트장력과 설계볼트장력의 관계는?","answer":"현장시공에서 표준볼트장력은 설계볼트장력에 10%를 할증한 값","blanks":["표준볼트장력","설계볼트장력","10%"],"page":88,"category":"강구조","kind":"빈출","note":""},{"id":"q047","q":"용접 결함의 종류를 쓰시오.","answer":"슬래그감싸들기\n언더컷\n오버랩\n블로홀\n피트\n크레이터","blanks":["슬래그감싸들기","언더컷","오버랩","블로홀","피트","크레이터"],"page":89,"category":"강구조","kind":"빈출","note":""},{"id":"q048","q":"용접부 비파괴검사법의 종류를 쓰시오.","answer":"방사선투과법\n자기분말탐상법\n초음파탐상법\n침투탐상법","blanks":["방사선","자기분말","초음파","침투"],"page":89,"category":"강구조","kind":"빈출","note":""},{"id":"q049","q":"메탈터치(Metal touch)란?","answer":"강구조 기둥 이음부를 가공하여 상하부 기둥의 밀착을 좋게 하고 축력을 접촉면으로 직접 전달시키는 이음방법","blanks":["기둥 이음부","밀착","축력","직접"],"page":89,"category":"강구조","kind":"빈출","note":""},{"id":"q050","q":"엔드탭(End tab)의 용도를 쓰시오.","answer":"용접 결함이 생기기 쉬운 용접비드의 시작과 끝 지점에 부착하는 보조강판","blanks":["용접비드","시작과 끝","보조강판"],"page":89,"category":"강구조","kind":"빈출","note":""},{"id":"q051","q":"데크플레이트(Deck plate)란?","answer":"구조용강판을 절곡 제작하여 바닥콘크리트 타설을 위한 슬래브 하부 거푸집판으로 사용하는 것","blanks":["구조용강판","절곡","슬래브","거푸집판"],"page":89,"category":"강구조","kind":"빈출","note":""},{"id":"q052","q":"CFT 구조의 개념과 특징을 쓰시오.","answer":"강관 안에 콘크리트를 충전한 구조로 강관의 구속효과로 콘크리트 내력이 상승하고 강관의 국부좌굴을 억제","blanks":["강관","콘크리트를 충전","구속효과","국부좌굴"],"page":90,"category":"강구조","kind":"빈출","note":""},{"id":"q053","q":"SM355의 의미를 쓰시오.","answer":"SM: 용접구조용 압연강재\n355: 항복강도 Fy = 355MPa","blanks":["용접구조용","355MPa"],"page":90,"category":"강구조","kind":"빈출","note":""},{"id":"q054","q":"벽돌벽 백화현상 방지대책을 쓰시오.","answer":"흡수율이 작은 소성 잘 된 벽돌 사용\n줄눈모르타르에 방수제 혼합\n벽체표면에 발수제 도포\n차양 설치로 빗물 차단","blanks":["흡수율","방수제","발수제","차양"],"page":90,"category":"조적·석재·목재","kind":"빈출","note":""},{"id":"q055","q":"ALC 제조에 필요한 주재료 2가지는?","answer":"생석회\n규사","blanks":["생석회","규사"],"page":90,"category":"조적·석재·목재","kind":"빈출","note":""},{"id":"q056","q":"깨진 석재를 붙일 때 사용하는 접착제는?","answer":"에폭시 수지 접착제","blanks":["에폭시 수지"],"page":90,"category":"조적·석재·목재","kind":"빈출","note":""},{"id":"q057","q":"시트방수의 장단점을 쓰시오.","answer":"장점: 재료의 균일성, 바탕균열에 대한 내구성 및 내후성 우수\n단점: 재료비가 비싸고 접합부 처리 및 복잡한 부분 마감 어려움","blanks":["균일성","내구성","재료비","접합부"],"page":91,"category":"미장·타일·방수","kind":"빈출","note":""},{"id":"q058","q":"복층유리란?","answer":"건조 공기층을 사이에 두고 판유리를 이중 접합하고 테두리를 밀봉하여 단열 및 소음차단 성능을 향상시킨 유리","blanks":["건조 공기층","이중 접합","밀봉","단열"],"page":91,"category":"유리·커튼월","kind":"빈출","note":""},{"id":"q059","q":"강화유리의 제조 방법과 강도는?","answer":"판유리를 연화점까지 가열한 후 급냉하여 일반 유리의 3~5배 강도를 갖게 한 유리","blanks":["가열","급냉","3~5배"],"page":91,"category":"유리·커튼월","kind":"빈출","note":""},{"id":"q060","q":"로이유리(Low-E, 저방사유리)란?","answer":"열적외선을 반사하는 은 소재 도막을 코팅하여 방사율과 열관류율을 낮추고 가시광선투과율을 높인 유리","blanks":["열적외선","은","방사율","열관류율"],"page":92,"category":"유리·커튼월","kind":"빈출","note":""},{"id":"q061","q":"커튼월 공사의 목업 성능시험 항목 4가지는?","answer":"기밀성능시험\n수밀성능시험\n영구변형시험\n구조성능시험","blanks":["기밀","수밀","영구변형","구조성능"],"page":92,"category":"유리·커튼월","kind":"빈출","note":""},{"id":"q062","q":"메탈라스와 펀칭메탈을 구분하시오.","answer":"메탈라스: 얇은 철판에 자름금을 내어 당겨 늘린 것\n펀칭메탈: 얇은 철판에 각종 모양을 도려낸 것","blanks":["자름금","당겨","모양","도려낸"],"page":92,"category":"기타공사","kind":"빈출","note":""},{"id":"q063","q":"징두리벽이란?","answer":"수장공사 시 바닥에서 1~1.5m 높이까지 널을 댄 것","blanks":["수장공사","1~1.5m","널"],"page":92,"category":"기타공사","kind":"빈출","note":""},{"id":"q064","q":"LCC의 의미는?","answer":"Life Cycle Cost: 건축물의 초기단계부터 설계·시공·유지관리·해체에 이르는 일련의 과정과 제비용","blanks":["Life Cycle Cost","설계","유지관리","해체"],"page":92,"category":"건축시공총론","kind":"빈출","note":""},{"id":"q065","q":"공개경쟁입찰과 지명경쟁입찰의 차이는?","answer":"공개경쟁입찰: 입찰참가자를 공모하여 유자격자 모두에게 참가 기회를 주는 방식\n지명경쟁입 function pr(id){return data.progress[id]||{status:'new',count:0,reviewCount:0}}
function due(card){let p=pr(card.id);return (p.status!=='new'||p.reviewCount>0)&&p.due&&p.due<=today}
function prevDayDue(card){const p=pr(card.id);return p.last===plusDays(today,-1)||due(card)}
function pillStatus(s){return s==='master'?'완벽하게 외운 것':s==='weak'?'더 공부할 것':s==='unknown'?'부족한 것':s==='unrated'?'평가 대기':'미학습'}
function goalCards(day){const cards=data.cards.filter(c=>c.kind===day.kind&&day.pages.includes(Number(c.page)));const fresh=cards.filter(isNewConcept);return {cards,fresh}}
function reviewQueue(){return data.cards.filter(c=>prevDayDue(c)&&!reviewRecord(c.id).completed).sort((a,b)=>{let x=pr(a.id),y=pr(b.id);let weight={unknown:0,weak:1,master:2,unrated:3,new:4};return (weight[x.status]??3)-(weight[y.status]??3)})}
function dayDone(day){return goalCards(day).cards.filter(c=>pr(c.id).first).length}
function countStatus(s){return data.cards.filter(c=>pr(c.id).status===s).length}

function renderModal(){if(!modal)return '';let content='';if(modal.type==='pdf'){content=pdfViewerHtml()}
else if(modal.type==='notpdf'){content=`<div class="flex"><h3>교재 PDF를 선택해 주세요</h3><button class="btn" onclick="closeModal()">닫기</button></div><p class="hint">문제의 출처는 교재 ${modal.page}쪽입니다. 처음 한 번 선택하면 이 브라우저에 저장합니다. 데이터가 삭제되었다면 다시 선택해 주세요.</p>${pdfSelectionHtml(modal.page)}`}

function editorHtml(){const c=data.cards.find(x=>x.id===editId)||{q:'',answer:'',blanks:[],kind:'전체',category:'가설공사',page:12};const cats=uniq(data.cards.map(x=>x.category));return `<div class="flex"><h2 style="margin:0">${editId?'개념 수정':'새 개념 등록'}</h2><button class="btn" onclick="closeModal()">닫기</button></div><p class="hint">정답은 한 줄에 한 항목씩 입력하세요. 2단계에서 빈칸으로 만들 단어만 ' | '로 구분해 주세요.</p><form id="editor" class="formgrid" onsubmit="saveEditor(event)"><div class="field full"><label>문제</label><textarea name="q" required>${safe(c.q)}</textarea></div><div class="field full"><label>기준 정답 (한 줄에 한 항목)</label><textarea name="answer" required style="min-height:140px">${safe(c.answer)}</textarea></div><div class="field full"><label>빈칸 키워드 ( | 로 구분)</label><textarea name="blanks" style="min-height:55px">${safe(c.blanks.join(' | '))}</textarea></div><div class="field"><label>문제 분류</label><select name="kind">${['빈출','전체'].map(x=>`<option ${x===c.kind?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>교재 PDF 쪽수</label><input name="page" type="number" min="1" max="111" value="${c.page}" required></div><div class="field full"><label>공종</label><input name="category" list="catlist" value="${safe(c.category)}" required><datalist id="catlist">${cats.map(x=>`<option value="${safe(x)}">`).join('')}</datalist></div><div class="btnrow" style="grid-column:1/-1;justify-content:space-between;margin-top:9px"><div>${editId?'<button type="button" class="btn warn" onclick="removeCard()">카드 삭제</button>':''}</div><button class="btn primary" type="submit">저장하기</button></div></form>`}
function saveEditor(ev){ev.preventDefault();const f=new FormData(ev.target);const v={q:f.get('q').trim(),answer:f.get('answer').trim(),blanks:f.get('blanks').split('|').map(x=>x.trim()).filter(Boolean),kind:f.get('kind'),page:Number(f.get('page')),category:f.get('category').trim()};if(!v.q||!v.answer||!v.category)return; if(editId){Object.assign(data.cards.find(x=>x.id===editId),v)}else{v.id='local_'+Date.now();data.cards.push(v)}save();modal=null;view='bank';render()}

function download(fn,txt,type){const u=URL.createObjectURL(new Blob([txt],{type}));const el=document.createElement('a');el.href=u;el.download=fn;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function importJSON(file){if(!file)return;try{
 const incoming=normalizeStudyData(JSON.parse(await file.text()));
 if(!confirm(incoming.cards.length+'개 문제와 기록을 기존 데이터에 병합할까요? 충돌 원본은 양쪽 모두 보존됩니다.'))return;
 const merged=mergeStudyData(data,incoming),before=JSON.stringify(data),serialized=JSON.stringify(merged);
 // Write only after full validation, and never discard the current state on quota failure.
 localStorage.setItem(STORE_KEY+'-before-import',before);
 localStorage.setItem(STORE_KEY,serialized);data=merged;loadReviewSetup();session=null;modal=null;render();
 alert('백업 병합 완료 · 보존된 충돌 '+(data.backupConflicts?.length||0)+'건. 전체 백업에 충돌 원본도 포함됩니다.');
 }catch(e){alert('가져오기 실패: '+e.message+' 기존 데이터는 유지됩니다.')}}

function startSession(cards,mode,label,reviewMode='free'){return withStudyInputCommit(()=>{

})}

else if(st===2){let segments=blankMarkup(c);inner=`<div class="tiny strong" style="margin-bottom:12px">빈칸으로 표시된 부분만 입력하면 됩니다.</div><div class="answerBox" id="blankArea">${segments.html}</div><div class="btnrow"><button type="button" class="btn" onclick="studyInputNotice('키보드의 완료를 눌러 한글 조합을 확정한 뒤 다음 칸을 누르세요.')">입력 확정 방법</button><button type="button" class="btn" onclick="downloadInputTrace()">입력 진단 저장</button></div><p class="hint">정답 원문의 나머지 문장은 이미 표시되어 있어요. 짧은 단어는 옆으로 배열했습니다.</p><div id="study-hint" class="feedback" ${session.hint?'':'hidden'}>${session.hint?'앞글자 힌트: '+safe(studyHintText(c)):''}</div>${session.checked?`<div class="feedback blank-feedback">${segments.found}개 빈칸 중 ${countCorrectBlanks(c)}개 정답</div>`:''}<div id="review-answer" class="answerBox" ${session.answerSeen?'':'hidden'}>${session.answerSeen?safe(c.answer):''}</div><div class="btnrow" style="margin-top:18px">${session.mode==='learn'?'':'<button class="btn" onclick="showReviewAnswer()">정답 보기</button>'}<button class="btn" data-study-hint onclick="toggleStudyHint()">힌트 ${session.hint?'접기':'보기'}</button><button class="btn" onclick="checkBlanks()">정답 확인</button><button class="btn" onclick="retryBlanks()">다시 풀기</button>${session.mode==='learn'?`<button class="btn primary" onclick="advance()" ${session.blankPassed?"":"disabled"}>3단계 백지서술로 →</button>`:`<button class="btn primary" onclick="completeModeReview()" ${session.blankPassed?"":"disabled"}>복습 완료</button>`}</div>`}
else if(session.mode==='learn'){inner=`<div class="tiny strong">백지서술 연습</div><p class="hint">정답을 떠올리며 작성하세요. 최초 학습에서는 숙지도를 평가하지 않습니다. 학습 완료 후 평가 대기로 저장하고 다음날 첫 복습에서 평가합니다.</p><textarea class="freeInput" id="freeInput" placeholder="기억한 내용을 서술하세요.">${safe(session.free)}</textarea><button class="btn primary" style="margin-top:16px" onclick="completeLearning()">학습 완료</button>`}
else{const p=pr(c.id);inner=`<div class="tiny strong" style="margin-bottom:12px">아무것도 보지 않고 시험답안처럼 작성하세요.</div><textarea class="freeInput" id="freeInput" placeholder="머릿속에서 정답을 꺼내 백지에 서술하세요.">${safe(session.free)}</textarea><div class="btnrow" style="margin:15px 0"><button class="btn" data-study-hint onclick="toggleStudyHint()">힌트 ${session.hint?'접기':'보기'}</button><button class="btn primary" onclick="reveal()">${session.revealed?'기준내용 다시 확인':'채점 / 기준내용 확인'}</button><span class="tiny muted">키워드 기반 자동 평가입니다. AI 의미 채점이 아니며 결과를 직접 수정할 수 있습니다.</span></div><div id="study-hint" class="feedback" ${session.hint?'':'hidden'}>${session.hint?'앞글자 힌트: '+safe(studyHintText(c)):''}</div>${session.revealed?`<div class="answerBox">${safe(c.answer)}</div><div class="keyhits">${c.blanks.map(k=>`<span class="${norm(session.free).includes(norm(k))?'hit':''}">${safe(k)}</span>`).join('')}</div><p class="hint" style="margin-top:11px">녹색 = 작성한 답안에 포함된 키워드 (띄어쓰기 무시). 동의어·서술형 의미까지 자동 판정하지는 않습니다.</p><div class="sectionhead" style="margin:21px 0 10px"><h2>자동 분류 결과</h2></div><div class="feedback">${(()=>{const a=autoAssess(c,session.free);return `핵심 키워드 ${a.matched}/${a.total}개 포함 · ${pillStatus(a.status)} (자동 추천)`})()}</div><p class="hint">이 프로그램은 브라우저에서 키워드와 답안 분량을 비교합니다. 문장 의미나 동의어를 AI처럼 이해하지 못하므로 자동 분류는 참고용입니다. 잘못 분류되면 아래에서 직접 선택할 수 있어요.</p><p class="hint">추천은 참고 정보입니다. 아래 세 등급 중 최종 결과를 직접 선택해야 완료됩니다.</p><div class="sectionhead" style="margin:21px 0 10px"><h2>필요하면 직접 수정</h2></div><div class="assess"><button onclick="rate('master')"><strong>완벽하게 외운 것</strong><div class="small">기준답안을 스스로 재현함 · ${reviewInterval('master',p,today).days}일 뒤</div></button><button onclick="rate('weak')"><strong>더 공부할 것</strong><div class="small">일부 핵심 누락 · 2일 뒤</div></button><button onclick="rate('unknown')"><strong>부족한 것</strong><div class="small">거의 쓰지 못함 · 다음날</div></button></div>`:''}`}
shell(`<div class="flex" style="margin-bottom:22px"><button class="btn" onclick="session=null;render()">← 나가기</button><div class="tiny muted">${session.idx+1} / ${session.ids.length}개념</div></div><div class="studybox">${steps}<div class="surface"><div class="flex"><span class="chip">${safe(c.kind)} · ${safe(c.category)}</span><button class="btn" onclick="openSource(${Number(c.page)})">교재 보기 · ${c.page}쪽 <span aria-hidden="true">↗</span></button></div><div class="qnum" style="margin-top:17px">QUESTION ${String(session.idx+1).padStart(2,'0')}</div><h2 class="question">${safe(c.q)}</h2><p id="study-input-status" class="hint" role="status"></p>${inner}</div><p class="hint" style="margin-top:19px">학습 기준답안은 원문을 바탕으로 작성된 학습용 문장입니다. 정확한 표현이 필요하면 해당 PDF쪽에서 직접 대조 후 문제은행에서 수정하세요.</p></div>`);
}
function typingLive(){const c=activeCard();const t=norm(session.typed),a=norm(c.answer);document.getElementById('live').textContent=`입력 분량 ${Math.min(100,Math.round(t.length/Math.max(a.length,1)*100))}% · 글자별 일치 ${t.length?Math.round([...t].filter((ch,i)=>a[i]===ch).length/t.length*100):0}% (참고용)`}
function advance(){return withStudyInputCommit(()=>{
 if(!session||session.stage>=3)return;
 if(session.stage===1){
  const target=sessionCopies();
  if(session.repeat<target){
   if(!norm(session.typed)||norm(session.typed)!==norm(activeCard().answer)){alert('기준 정답을 정확하게 입력해야 반복 횟수가 올라갑니다. 띄어쓰기는 무시합니다.');return}
   session.repeat++;session.typed='';
   if(session.repeat<target){renderSession();return}
  }
 }
 if(session.stage===2&&!session.blankPassed){alert('핵심 빈칸을 모두 맞힌 뒤 다음 단계로 이동할 수 있어요.');return}
 if(session.mode!=='learn'){renderSession();return}
 session.stage++;session.checked=false;session.hint=false;renderSession();
})}
function blankMarkup(c){
 const keys=c.blanks.map(x=>String(x).trim()).filter(Boolean),used=new Set();let found=0;const lines=c.answer.split('\n');let out=[],shortGroup=[];
 function flush(){if(shortGroup.length){out.push(`<div class="answerRow short">${shortGroup.join('')}</div>`);shortGroup=[]}}
 for(const line of lines){let parts=[{text:line,type:'text'}];
  for(let ki=0;ki<keys.length;ki++){if(used.has(ki))continue;const k=keys[ki],next=[];let replaced=false;
   for(const p of parts){if(p.type!=='text'||replaced){next.push(p);continue}const ix=p.text.indexOf(k);if(ix<0){next.push(p);continue}next.push({text:p.text.slice(0,ix),type:'text'},{text:k,type:'blank',i:found},{text:p.text.slice(ix+k.length),type:'text'});replaced=true}
   if(replaced){parts=next;used.add(ki);found++}
  }
  const piece=`<div class="line">${parts.map(p=>p.type==='text'?safe(p.text).replaceAll(' ','&nbsp;'):`<input class="blankInput" readonly id="blank-${safe(c.id)}-${p.i}" name="blank-${safe(c.id)}-${p.i}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-idx="${p.i}" data-key="${safe(p.text)}" style="width:${Math.max(9,Math.min(23,p.text.length+4))}ch" aria-label="핵심 빈칸 ${p.i+1}" value="${safe(session.blank[p.i]||'')}">`).join('')}</div>`;
  if(norm(line).length<18){shortGroup.push(piece)}else{flush();out.push(`<div class="answerRow">${piece}</div>`)}
 }
 flush();if(!found)return{html:`<div class="hint">설정된 빈칸 키워드가 본문과 일치하지 않습니다. 문제은행에서 해당 카드를 수정해 주세요.</div><div>${safe(c.answer)}</div>`,found};
 return{html:out.join(''),found}
}
function countCorrectBlanks(c){let all=Array.from(document.querySelectorAll('.blankInput'));return all.filter(el=>norm(el.value)===norm(el.dataset.key)).length}
function checkBlanks(){return withStudyInputCommit(()=>{if(!session||session.stage!==2)return;const inputs=[...document.querySelectorAll('.blankInput')];if(!inputs.length){alert('설정된 빈칸이 없습니다. 문제은행에서 키워드를 확인하세요.');return}let good=0;inputs.forEach(el=>{const ok=norm(el.value)===norm(el.dataset.key);good+=Number(ok);el.classList.toggle('right',ok);el.classList.toggle('wrong',!ok)});session.checked=true;session.blankPassed=good===inputs.length;document.querySelectorAll('.feedback.blank-feedback').forEach(x=>x.remove());const fb=document.createElement('div');fb.className='feedback blank-feedback';fb.textContent=session.blankPassed?`정답 ${good}/${inputs.length}개 · 모두 맞혔어요! ${session.mode==='learn'?'이제 3단계로 이동할 수 있어요.':'복습 완료를 눌러 기록하세요.'}`:`정답 ${good}/${inputs.length}개 · 틀린 빈칸은 다시 풀기를 눌러 재도전하세요.`;document.getElementById('blankArea').after(fb);const next=document.querySelector('button[onclick="advance()"],button[onclick="completeModeReview()"]');if(next)next.disabled=!session.blankPassed})}
function retryBlanks(){return withStudyInputCommit(()=>{if(!session||session.stage!==2)return;session.blank=[];session.checked=false;session.blankPassed=false;session.hint=false;session.answerSeen=false;session.revealed=false;renderSession()})}
function autoAssess(c,answer){const response=norm(answer);const keys=[...new Set(c.blanks.map(norm).filter(Boolean))];if(!response)return {status:'unknown',ratio:0,matched:0,total:keys.length};const matched=keys.filter(k=>response.includes(k)).length;const ratio=keys.length?matched/keys.length:0;const lengthRatio=response.length/Math.max(1,norm(c.answer).length);const status=(keys.length&&ratio>=.9&&lengthRatio>=.55)?'master':(matched===0||ratio<.3||lengthRatio<.15)?'unknown':'weak';return {status,ratio,matched,total:keys.length}}
function autoRate(){return reveal()} // Backward-compatible helper: suggestion only, never auto-save.
function reveal(){return withStudyInputCommit(()=>{if(!session||session.mode==='learn')return;session.free=document.getElementById('freeInput').value;session.revealed=true;renderSession()})}
function rate(s){return withStudyInputCommit(()=>{
 if(!session||session.mode==='learn'||session.reviewMode!=='free'||session.stage!==3||!session.revealed)return;
 if(!['master','weak','unknown'].includes(s))return;
 saveReviewResult(s,true);
})}
</script><script src="backup-data.js?v=1"></script><script src="exam-schedule.js?v=1"></script><script src="adaptive-review.js?v=3"></script><script src="study-input.js?v=3"></script><script src="textbook.js?v=4"></script><script>data=normalizeStudyData(data);loadReviewSetup();render();restorePdf();</script></body></html>
